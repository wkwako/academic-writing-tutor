{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Academic Writing Tutor</title>
    <link rel="stylesheet" href="{% static 'tutor/css/style.css' %}">
    <script src="{% static 'tutor/js/tutor.js' %}" defer></script>
</head>
<body>
    <div class="wrap">
        <h1>Academic Writing Tutor</h1>
        <form method="post" id="tutor-form">
            {% csrf_token %}
            <label for="passage">Your writing</label>
            <textarea id="passage" name="passage" rows="12" placeholder="Paste your passage here...">{{ submitted_text }}</textarea> <br>

            <label for="topic">Topic <span class="optional">(optional)</span></label>
            <textarea id="topic" name="topic" rows="2" placeholder="What is the writing about?">{{ topic_text }}</textarea> <br>

            <label for="purpose">Purpose <span class="optional">(optional)</span></label>
            <textarea id="purpose" name="purpose" rows="2" placeholder="What is it for? e.g. a cover letter, a history essay">{{ purpose_text }}</textarea> <br>

            <fieldset class="analyzers">
                <legend>Feedback to include</legend>
                {% for a in analyzers %}
                <label class="check">
                    <input type="checkbox" name="analyzers" value="{{ a.name }}" {% if a.checked %}checked{% endif %}>
                    {{ a.label }}
                </label>
                {% endfor %}
            </fieldset>
            <button type="submit">Analyze</button>
        </form>

        <div id="feedback-region">
            {% if feedback %}
            <div class="feedback">
                <h2>Feedback</h2>
                {{ feedback|linebreaks }}
            </div>
            {% endif %}
        </div>

        <div class="skeleton" id="skeleton" hidden aria-hidden="true">
            <h2>Analyzing…</h2>
            <div class="skeleton-line"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line short gap"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line short"></div>
        </div>
    </div>
</body>
</html>
